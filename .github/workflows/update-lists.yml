name: Update VPN subscription lists
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: update-vpn-subscription-lists
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: generator
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: marcomc/glinet-vpn-subscription-lists
          path: lists
          ssh-key: ${{ secrets.LISTS_DEPLOY_KEY }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install generator dependencies
        working-directory: generator
        run: python -m pip install -r requirements.txt
      - name: Test generator
        working-directory: generator
        run: python -m unittest discover -s tests -v
      - name: Generate and validate subscriptions
        working-directory: generator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/generate.py --output-root ../lists
          python scripts/validate.py --root ../lists
          python scripts/render_catalog.py --root ../lists
      - name: Commit changed subscriptions
        working-directory: lists
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A README.md output reports/coverage.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Update VPN subscription lists'
          git push origin HEAD:main
