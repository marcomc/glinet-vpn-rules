providers:
  google:
    core:
      output: output/google/google-core-domains.txt
      sources:
      - blackmatrix7:GoogleSearch
      - curated:google-core
      limitations:
      - Shared authentication domains may also serve other Google products.
    apis:
      output: output/google/google-apis-domains.txt
      sources:
      - v2fly:firebase
      - curated:google-apis
      limitations:
      - googleapis.com is shared across services.
    gmail:
      output: output/google/google-gmail-domains.txt
      sources:
      - curated:google-gmail
      limitations:
      - Authentication and static assets may require google-core and google-apis.
    youtube:
      output: output/google/google-youtube-domains.txt
      sources:
      - v2fly:youtube
      - blackmatrix7:YouTubeMusic
      limitations:
      - YouTube may also use shared Google authentication and static assets.
    drive:
      output: output/google/google-drive-domains.txt
      sources:
      - blackmatrix7:GoogleDrive
      limitations:
      - Google Drive rules include shared googleusercontent.com.
    docs:
      output: output/google/google-docs-domains.txt
      sources:
      - curated:google-docs
      limitations:
      - Docs, Sheets and Slides may use Drive and shared Google APIs.
    maps:
      output: output/google/google-maps-domains.txt
      sources:
      - curated:google-maps
      limitations:
      - Maps uses shared Google infrastructure.
    photos:
      output: output/google/google-photos-domains.txt
      sources:
      - curated:google-photos
      limitations:
      - Photos may use shared googleusercontent.com.
    meet:
      output: output/google/google-meet-domains.txt
      sources:
      - curated:google-meet
      limitations:
      - Media transport can use shared endpoints.
    cloud:
      output: output/google/google-cloud-domains.txt
      sources:
      - curated:google-cloud
      limitations:
      - Google Cloud customer IP ranges are excluded.
    ads:
      output: output/google/google-ads-domains.txt
      sources:
      - v2fly:dart
      - curated:google-ads
      limitations:
      - Ad infrastructure can overlap with other services.
    play:
      output: output/google/google-play-domains.txt
      sources:
      - v2fly:google-play
    gemini:
      output: output/google/google-gemini-domains.txt
      sources:
      - v2fly:google-gemini
      - v2fly:google-deepmind
      limitations:
      - Gemini may use shared authentication and API endpoints.
    other:
      output: output/google/google-other-domains.txt
      sources:
      - v2fly:google
      - blackmatrix7:Google
      - metacubex:google
      limitations:
      - Remainder of broad upstream Google definitions after explicit service assignments.
      remaining: true
    all:
      output: output/google/google-all-domains.txt
      sources: []
      limitations:
      - Union of all Google service lists; shared domains can appear in several lists.
  apple:
    all:
      output: output/apple/apple-all-domains.txt
      sources:
      - v2fly:apple
      - blackmatrix7:Apple
  microsoft:
    all:
      output: output/microsoft/microsoft-all-domains.txt
      sources:
      - official:microsoft-365-domains
      - v2fly:microsoft
      - blackmatrix7:Microsoft
      limitations:
      - Microsoft 365 includes shared third-party dependencies and is not an exclusive ownership list.
  openai:
    all:
      output: output/openai/openai-all-domains.txt
      sources:
      - official:openai-network-domains
      - v2fly:openai
      - blackmatrix7:OpenAI
      limitations:
      - IP variants contain only official ChatGPT Voice server ranges on UDP port 3478; other ChatGPT destination IPs are not covered.
      - Crawler and integration egress feeds are excluded from client-destination IP rules.
      - Shared third-party domains in community sources can route unrelated traffic.
  meta:
    all:
      output: output/meta/meta-all-domains.txt
      sources:
      - v2fly:meta
      - v2fly:facebook
      - v2fly:instagram
      - blackmatrix7:Facebook
      - blackmatrix7:Instagram
  amazon:
    all:
      output: output/amazon/amazon-all-domains.txt
      sources:
      - v2fly:amazon
      - v2fly:aws
      - blackmatrix7:Amazon
  netflix:
    all:
      output: output/netflix/netflix-all-domains.txt
      sources:
      - v2fly:netflix
      - blackmatrix7:Netflix
  spotify:
    all:
      output: output/spotify/spotify-all-domains.txt
      sources:
      - blackmatrix7:Spotify
  cloudflare:
    all:
      output: output/cloudflare/cloudflare-all-domains.txt
      sources:
      - v2fly:cloudflare
      - blackmatrix7:Cloudflare
  anthropic:
    all:
      output: output/anthropic/anthropic-all-domains.txt
      sources:
      - v2fly:anthropic
      - blackmatrix7:Anthropic
  x:
    all:
      output: output/x/x-all-domains.txt
      sources:
      - blackmatrix7:Twitter
  telegram:
    all:
      output: output/telegram/telegram-all-domains.txt
      sources:
      - blackmatrix7:Telegram
  tiktok:
    all:
      output: output/tiktok/tiktok-all-domains.txt
      sources:
      - blackmatrix7:TikTok
ip_sources:
  google-services:
    format: google-services
    url: https://www.gstatic.com/ipranges/goog.json
    exclude_url: https://www.gstatic.com/ipranges/cloud.json
    license: Google published data
  microsoft-365:
    format: microsoft-365
    url: https://endpoints.office.com/endpoints/worldwide
    version_url: https://endpoints.office.com/version/worldwide
    license: Microsoft published data
  openai-voice:
    format: openai-voice
    url: https://openai.com/chatgpt-voice.json
    license: OpenAI published data
    classification: ChatGPT Voice server destinations for UDP port 3478, not all OpenAI services
  telegram:
    format: cidr-lines
    url: https://core.telegram.org/resources/cidr.txt
